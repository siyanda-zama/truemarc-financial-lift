@font-face{font-family:H;src:url(font.woff2) format('woff2');font-weight:100 900}

.call svg{width:30px;height:30px}
.note{font-size:25px;font-weight:600;line-height:1.3;color:rgba(255,255,255,.74)}
.note b{color:#fff;font-weight:700}
